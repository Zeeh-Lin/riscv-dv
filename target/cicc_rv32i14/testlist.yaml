- test: cicc_rand_instr_test
  description: >
    Random instruction test constrained to the CICC RV32I-14 subset.
  iterations: 1
  gen_test: cicc_rand_instr_test
  gen_opts: >
    +instr_cnt=40
    +num_of_sub_program=0
    +boot_mode=m
    +bare_program_mode=1
    +no_csr_instr=1
    +no_ebreak=1
    +no_dret=1
    +no_fence=1
    +no_wfi=1
    +illegal_instr_ratio=0
    +hint_instr_ratio=0
    +enable_unaligned_load_store=0
    +disable_compressed_instr=1
    +set_mstatus_mprv=0
    +set_mstatus_tw=0
    +enable_interrupt=0
    +enable_nested_interrupt=0
    +enable_timer_irq=0
    +num_of_harts=1

- test: cicc_rand_instr_stress_test
  description: >
    Stress random instruction test constrained to the CICC RV32I-14 subset.
  iterations: 1
  gen_test: cicc_rand_instr_test
  gen_opts: >
    +instr_cnt=120
    +num_of_sub_program=0
    +boot_mode=m
    +bare_program_mode=1
    +no_csr_instr=1
    +no_ebreak=1
    +no_dret=1
    +no_fence=1
    +no_wfi=1
    +illegal_instr_ratio=0
    +hint_instr_ratio=0
    +enable_unaligned_load_store=0
    +disable_compressed_instr=1
    +set_mstatus_mprv=0
    +set_mstatus_tw=0
    +enable_interrupt=0
    +enable_nested_interrupt=0
    +enable_timer_irq=0
    +num_of_harts=1
